[workspace]
members = ["crates/sqfvm"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"

[package]
name = "sqf-discord"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serenity = { version = "0.12.5", default-features = false, features = ["cache", "client", "gateway", "model", "rustls_backend"] }
sqfvm = { path = "crates/sqfvm" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
